services:
  postgres:
    image: postgres:16-alpine
    container_name: hexocnc-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-hexocnc}
      POSTGRES_USER: ${DB_USERNAME:-hexocnc}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hexocnc}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hexocnc-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: hexocnc-rabbitmq
    ports:
      - "${RABBIT_PORT:-5672}:5672"
      - "${RABBIT_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  rabbitmq-data:
  postgres-data:
  redis-data:
