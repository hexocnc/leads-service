spring:
  application:
    name: hexo-leads-service

  datasource:
    # Postgres runs in Docker on the same VPS, bound to 127.0.0.1 only
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USERNAME:guest}
    password: ${RABBIT_PASSWORD:guest}
    listener:
      simple:
        # don't redeliver forever when processing fails
        default-requeue-rejected: false

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  rabbit:
    exchange: leads.exchange
    lead-created:
      queue: leads.lead-created
      routing-key: lead.created
  processed-events:
    retention: 1d
    cleanup-cron: "0 0 3 * * *"

logging:
  file:
    name: ./logs/leadservice.log